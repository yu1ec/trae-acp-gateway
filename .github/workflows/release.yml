name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: '--target universal-apple-darwin --no-sign'
            cli_path: target/universal-apple-darwin/release/trae_acp_gateway
            cli_asset: trae_acp_gateway-macos-universal
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            rust_targets: ''
            tauri_args: '--target x86_64-unknown-linux-gnu --no-sign'
            cli_path: target/release/trae_acp_gateway
            cli_asset: trae_acp_gateway-linux-x86_64
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            rust_targets: ''
            tauri_args: '--target x86_64-pc-windows-msvc --no-sign'
            cli_path: target/release/trae_acp_gateway.exe
            cli_asset: trae_acp_gateway-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './app -> target'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/frontend

      - name: Validate version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          TAURI_VERSION=$(jq -r .version app/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "Version mismatch:"
            echo "  tag:   $TAG_VERSION"
            echo "  cargo: $CARGO_VERSION"
            echo "  tauri: $TAURI_VERSION"
            exit 1
          fi
          echo "Version OK: $TAG_VERSION"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build CLI
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create \
              target/aarch64-apple-darwin/release/trae_acp_gateway \
              target/x86_64-apple-darwin/release/trae_acp_gateway \
              -output target/universal-apple-darwin/release/trae_acp_gateway
          else
            cargo build --release
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Trae ACP Gateway ${{ github.ref_name }}
          releaseBody: |
            ## CLI
            - `trae_acp_gateway-macos-universal` — macOS
            - `trae_acp_gateway-linux-x86_64` — Linux
            - `trae_acp_gateway-windows-x86_64.exe` — Windows

            ## App (stable names for auto-update)
            - `Trae-ACP-Gateway-macos-universal.dmg` — macOS
            - `Trae-ACP-Gateway-linux-x86_64.AppImage` — Linux
            - `Trae-ACP-Gateway-windows-x86_64.msi` — Windows

            ## App (bundles from Tauri)
            - macOS: `.app` + DMG (Universal)
            - Linux: DEB + AppImage
            - Windows: MSI + NSIS
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Upload App installer (stable names)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            triple="universal-apple-darwin"
          elif [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            triple="x86_64-unknown-linux-gnu"
          else
            triple="x86_64-pc-windows-msvc"
          fi
          bundle_root=""
          for candidate in "target/${triple}/release/bundle" "target/release/bundle"; do
            if [ -d "$candidate" ]; then
              bundle_root="$candidate"
              break
            fi
          done
          if [ -z "$bundle_root" ]; then
            echo "Bundle directory not found under target/" >&2
            find target -type d -name bundle 2>/dev/null | sed 's/^/  /' || true
            exit 1
          fi
          echo "Using bundle root: $bundle_root"
          case "${{ matrix.platform }}" in
            macos-latest)
              dmg=$(find "$bundle_root/dmg" -name '*.dmg' -type f | head -1)
              if [ -z "$dmg" ]; then
                echo "DMG not found under $bundle_root/dmg" >&2
                exit 1
              fi
              cp "$dmg" /tmp/Trae-ACP-Gateway-macos-universal.dmg
              gh release upload "${{ github.ref_name }}" /tmp/Trae-ACP-Gateway-macos-universal.dmg --clobber
              ;;
            ubuntu-22.04)
              appimage=$(find "$bundle_root/appimage" -name '*.AppImage' -type f | head -1)
              if [ -z "$appimage" ]; then
                echo "AppImage not found under $bundle_root/appimage" >&2
                exit 1
              fi
              cp "$appimage" /tmp/Trae-ACP-Gateway-linux-x86_64.AppImage
              gh release upload "${{ github.ref_name }}" /tmp/Trae-ACP-Gateway-linux-x86_64.AppImage --clobber
              ;;
            windows-latest)
              msi=$(find "$bundle_root/msi" -name '*.msi' -type f | head -1)
              if [ -z "$msi" ]; then
                echo "MSI not found under $bundle_root/msi" >&2
                exit 1
              fi
              cp "$msi" /tmp/Trae-ACP-Gateway-windows-x86_64.msi
              gh release upload "${{ github.ref_name }}" /tmp/Trae-ACP-Gateway-windows-x86_64.msi --clobber
              ;;
          esac

      - name: Upload CLI binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ matrix.cli_path }}#${{ matrix.cli_asset }}" \
            --clobber
