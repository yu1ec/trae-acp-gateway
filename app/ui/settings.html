<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, "Segoe UI", sans-serif; margin: 16px; }
  .row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; font-weight: 600; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid gray5; border-radius: 6px; }
  input[type=number] { width: 120px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  button { padding: 6px 14px; border-radius: 6px; border: 1px solid #8888; cursor: pointer; }
  .checks label { display: inline; font-weight: normal; }
  #status { margin-top: 14px; color: gray; min-height: 18px; }
  #save { margin-top: 10px; }
</style>
</head>
<body>
  <div class="row">
    <label for="port">Port</label>
    <input type="number" id="port" min="1" max="65535">
  </div>
  <div class="row">
    <label for="workdir">Workdir</label>
    <div class="inline">
      <input type="text" id="workdir">
      <button id="pick">Choose…</button>
    </div>
  </div>
  <div class="row">
    <label for="trae_cmd">Trae command</label>
    <input type="text" id="trae_cmd">
  </div>
  <div class="row">
    <label for="trae_args">Trae args (comma separated)</label>
    <input type="text" id="trae_args">
  </div>
  <div class="row checks">
    <label><input type="checkbox" id="sandbox"> Sandbox</label>
  </div>
  <div class="row checks">
    <label><input type="checkbox" id="debug"> Debug logging</label>
  </div>
  <div class="row checks">
    <label><input type="checkbox" id="autostart"> Launch at login</label>
  </div>
  <button id="save">Save</button>
  <div id="status"></div>
<script>
  const { invoke } = window.__TAURI__.core;

  function status(msg) { document.getElementById('status').textContent = msg; }

  async function load() {
    const cfg = await invoke('get_config');
    document.getElementById('port').value = cfg.port;
    document.getElementById('workdir').value = cfg.workdir;
    document.getElementById('trae_cmd').value = cfg.trae_cmd;
    document.getElementById('trae_args').value = cfg.trae_args.join(', ');
    document.getElementById('sandbox').checked = cfg.sandbox;
    document.getElementById('debug').checked = cfg.debug;
    document.getElementById('autostart').checked = cfg.autostart;
  }

  document.getElementById('pick').addEventListener('click', async () => {
    const dir = await invoke('pick_workdir');
    if (dir) document.getElementById('workdir').value = dir;
  });

  document.getElementById('save').addEventListener('click', async () => {
    try {
      const cfg = {
        port: parseInt(document.getElementById('port').value, 10) || 8080,
        workdir: document.getElementById('workdir').value.trim() || '.',
        trae_cmd: document.getElementById('trae_cmd').value.trim() || 'traecli',
        trae_args: document.getElementById('trae_args').value.split(',').map(s => s.trim()).filter(Boolean),
        sandbox: document.getElementById('sandbox').checked,
        debug: document.getElementById('debug').checked,
        autostart: document.getElementById('autostart').checked,
      };
      await invoke('save_config', { cfg });
      status('Saved. Gateway restarted if it was running.');
    } catch (e) {
      status('Error: ' + e);
    }
  });

  load().catch(e => status('Error: ' + e));
</script>
</body>
</html>
