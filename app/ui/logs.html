<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logs</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  pre { height: 100%; box-sizing: border-box; margin: 0; padding: 10px; font: 12px ui-monospace, Menlo, Consolas, monospace; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<pre id="logs"></pre>
<script>
  const { invoke } = window.__TAURI__.core;
  const el = document.getElementById('logs');
  let last = '';

  setInterval(async () => {
    try {
      const lines = await invoke('get_logs');
      const text = lines.join('\n');
      if (text !== last) {
        const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 4;
        el.textContent = text;
        last = text;
        if (atBottom) el.scrollTop = el.scrollHeight;
      }
    } catch (e) { /* window closing */ }
  }, 500);
</script>
</body>
</html>
