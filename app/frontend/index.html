<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trae ACP Gateway</title>
    <script>
      // Paint the saved theme before the bundle loads so a dark window never
      // flashes white. Kept in sync with src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("trae-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          if (window.location.hash.indexOf("/thoughts") !== -1) {
            root.dataset.window = "thoughts";
          }
        } catch (e) {
          // storage unavailable; the bundle applies the theme again
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
