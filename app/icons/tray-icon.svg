<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Trae-inspired muted green pixel mark for the menu bar.
       Original 5x7 frame with diamond eyes; not the official TRAE logo. -->
  <g fill="#2B8F5E">
    <!-- row 0: top bar -->
    <rect x="24" y="8" width="16" height="16"/>
    <rect x="40" y="8" width="16" height="16"/>
    <rect x="56" y="8" width="16" height="16"/>
    <rect x="72" y="8" width="16" height="16"/>
    <rect x="88" y="8" width="16" height="16"/>
    <!-- left stem (rows 1-4) -->
    <rect x="24" y="24" width="16" height="16"/>
    <rect x="24" y="40" width="16" height="16"/>
    <rect x="24" y="56" width="16" height="16"/>
    <rect x="24" y="72" width="16" height="16"/>
    <!-- right stem (rows 1-5) -->
    <rect x="88" y="24" width="16" height="16"/>
    <rect x="88" y="40" width="16" height="16"/>
    <rect x="88" y="56" width="16" height="16"/>
    <rect x="88" y="72" width="16" height="16"/>
    <rect x="88" y="88" width="16" height="16"/>
    <!-- stepped lower-left -->
    <rect x="40" y="88" width="16" height="16"/>
    <!-- bottom bar -->
    <rect x="24" y="104" width="16" height="16"/>
    <rect x="40" y="104" width="16" height="16"/>
    <rect x="56" y="104" width="16" height="16"/>
    <rect x="72" y="104" width="16" height="16"/>
    <rect x="88" y="104" width="16" height="16"/>
    <!-- diamond eyes -->
    <polygon points="48,40 56,48 48,56 40,48"/>
    <polygon points="80,40 88,48 80,56 72,48"/>
  </g>
</svg>
